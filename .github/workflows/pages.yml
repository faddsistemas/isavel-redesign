name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: test -f data/vehicles.json || cp redesign-input/isavel/vehicles.json data/vehicles.json || true
      - run: test -d public/vehicles || node scripts/download-vehicle-images.mjs
      - run: cp redesign-input/isavel/assets/* public/assets/ 2>/dev/null || true
      - run: npm run build
      - run: cp public/.nojekyll out/.nojekyll
      - run: npm run test:smoke
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
